<app-loader [show]="loader"></app-loader>

<!-- HERO / Carousel -->
<div style="padding-left: 20px; padding-right: 20px">
  <section class="hero" *ngIf="featured.length">
    <div class="slides" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
      <section class="slide" *ngFor="let f of featured" [style.backgroundImage]="
    'linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.65)), url(' +
    f.bg +
    ')'
  ">
        <div class="hero-content">
          <h1>{{ f.title }}</h1>
          <p>{{ f.tagline }}</p>
          <div class="hero-actions">
            <button class="btn" routerLink="/login">Sign In</button>
            <button class="btn ghost" routerLink="/register">Sign Up</button>
          </div>
        </div>
      </section>

    </div>

    <div class="carousel-controls">
      <button (click)="prevSlide()">◀</button>
      <button (click)="nextSlide()">▶</button>
    </div>
  </section>

  <!-- Filters -->
  <div class="filters-row">
    <div class="filters">
      <span *ngFor="let cat of categories;let i=index;">
        <a href="#section{{i}}" class="chip active"> {{ cat }} </a>
      </span>
    </div>

    <!-- <div class="right-controls" style="float: right">
      <div class="badge">City: Guwahati</div>
      <button class="btn ghost" (click)="resetFilters()">Reset</button>
    </div> -->
  </div>

  <main class="jtv-main" *ngIf="categories.length; else noResults">

    <section *ngFor="let cat of categories; let i = index" class="category-section category-bg-{{ i % 6 }}"
      id="section{{ i }}">
      <div class="category-header">
        <h2 class="cat-title">{{ cat }}</h2>
        <a [routerLink]="['/events-by-category', cat]" class="view-all">
          View All >
        </a>
      </div>

      <div class="slider-container">
        <div class="card-slider">
          <div class="slider-wrapper">
            <article *ngFor="let m of groupedChannels[cat]" class="event-card">
              <div class="image-container">
                <img [src]="m.poster" alt="{{ m.title }}" loading="lazy" />
              </div>

              <div class="meta">
                <div class="title-row">
                  <div>
                    <div class="title">{{ m.title }}</div>
                    <div class="sub">{{ m.genre }} • {{ m.runtime }}</div>
                  </div>
                  <div class="imdb">{{ m.city }}</div>
                </div>

                <div class="spacer"></div>

                <div class="card-footer">
                  <div class="lang">{{ m.organizer }}</div>
                  <a [routerLink]="['/event', m.id]" class="btn btn-outline-primary btn-sm w-100">
                    View
                  </a>
                </div>
              </div>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>


  <ng-template #noResults>
    <div class="no-results">No results found</div>
  </ng-template>
</div>

<ngx-spinner bdColor="rgba(255,255,255,0.8)" size="medium" color="#5b3fd4" type="ball-spin-clockwise"
  [fullScreen]="false" name="nowShowingSectionSpinner"></ngx-spinner>
